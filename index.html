<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Table — three kitchens, one table</title>
<meta name="description" content="Three Singapore hawker classics — Hainanese chicken rice, nasi lemak, and roti prata — on one page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FFF9F0;
    --ink:#1D1712;
    --chinese:#E15241;
    --malay:#3FA06B;
    --indian:#E3A93B;
    --bg: var(--chinese);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    color:var(--cream);
    font-family:'Work Sans', sans-serif;
    overflow-x:hidden;
    transition:background 0.7s var(--ease);
    min-height:100svh;
    display:flex; flex-direction:column;
  }
  .display{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    line-height:0.9;
    margin:0;
  }
  .mono{ font-family:'Space Mono', monospace; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- radial color-wipe transition ---------- */
  .wipe{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    clip-path:circle(0px at 50% 50%);
  }

  /* ---------- entrance stagger ---------- */
  .reveal{ opacity:0; transform:translateY(22px); transition:opacity .8s var(--ease), transform .8s var(--ease); }
  .reveal.in{ opacity:1; transform:translateY(0); }

  /* ---------- nav ---------- */
  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:26px clamp(20px,5vw,56px) 0;
    position:relative; z-index:6;
  }
  .nav-logo{ font-family:'Anton',sans-serif; font-size:18px; letter-spacing:0.06em; }
  .flavor-tabs{ display:flex; gap:34px; position:relative; }
  .flavor-tab{
    background:none; border:none; font-family:'Space Mono',monospace; font-size:13px;
    letter-spacing:0.08em; text-transform:uppercase; color:rgba(255,249,240,0.65); cursor:pointer;
    padding:6px 2px; border-bottom:2px solid transparent;
    transition:color .3s var(--ease);
  }
  .flavor-tab.active{ color:var(--cream); }
  .tab-indicator{
    position:absolute; bottom:0; height:2px; background:var(--cream);
    transition:left .4s var(--ease), width .4s var(--ease);
  }
  .nav-right{ font-size:12px; letter-spacing:0.06em; color:rgba(255,249,240,0.7); }
  @media (max-width:720px){ .flavor-tabs{ gap:18px; } .nav-right{ display:none; } }

  /* ---------- stage ---------- */
  .stage{
    position:relative; flex:1; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    padding:20px 20px 0; overflow:hidden; min-height:520px;
  }
  .eyebrow{ font-size:12px; letter-spacing:0.22em; color:rgba(255,249,240,0.7); margin-bottom:18px; z-index:5; position:relative; }

  .word-wrap{ position:relative; width:100%; max-width:1100px; height:clamp(180px,34vw,340px); }
  .word{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:clamp(56px,13vw,168px); color:var(--cream); opacity:0; transform:translateY(26px);
    transition:opacity .5s var(--ease), transform .6s var(--ease); z-index:1; white-space:nowrap;
  }
  .word.active{ opacity:0.9; transform:translateY(0); }

  .dish-stage{ position:absolute; inset:0; z-index:3; display:flex; align-items:center; justify-content:center; perspective:900px; }
  .dish{
    position:absolute; width:clamp(220px,26vw,320px); opacity:0;
    transform:scale(0.8) rotate(-6deg); pointer-events:none; filter:drop-shadow(0 30px 40px rgba(0,0,0,0.28));
    transition:opacity .5s var(--ease), transform .6s var(--ease);
    transform-style:preserve-3d;
  }
  .dish img{ width:100%; display:block; }
  .dish.active{ opacity:1; transform:scale(1) rotate(0deg); }
  .dish-tilt{ will-change:transform; }

  .meta{ z-index:5; position:relative; margin-top:8px; }
  .stall-tag{ font-size:12px; letter-spacing:0.16em; color:rgba(255,249,240,0.75); margin-bottom:8px; }
  .desc{ max-width:440px; margin:0 auto; font-size:14.5px; line-height:1.65; color:rgba(255,249,240,0.85); }

  .foot-row{
    z-index:5; position:relative; display:flex; align-items:center; justify-content:space-between;
    padding:22px clamp(20px,5vw,56px) 30px; gap:16px; flex-wrap:wrap;
  }
  .price{ font-family:'Space Mono',monospace; font-size:13px; color:rgba(255,249,240,0.8); }
  .price b{ color:var(--cream); font-size:18px; }
  .cta{
    display:inline-flex; align-items:center; gap:10px; font-size:13px; letter-spacing:0.1em;
    font-weight:600; color:var(--cream); cursor:pointer; background:none; border:none;
    position:relative; overflow:hidden; padding:10px 16px; border-radius:999px;
    transition:transform .15s var(--ease);
  }
  .cta span{ display:inline-block; transition:transform .25s var(--ease); }
  .cta:hover span{ transform:translateX(6px); }
  .cta .ripple{
    position:absolute; border-radius:50%; background:rgba(255,249,240,0.35);
    transform:scale(0); animation:rippleOut .6s var(--ease) forwards; pointer-events:none;
  }
  @keyframes rippleOut{ to{ transform:scale(1); opacity:0; } }
  .credit{ font-size:11px; color:rgba(255,249,240,0.55); letter-spacing:0.04em; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>

<div class="wipe" id="wipe"></div>

<nav class="reveal" id="reveal-nav">
  <div class="nav-logo">ONE TABLE</div>
  <div class="flavor-tabs" role="tablist" aria-label="Choose a dish">
    <button class="flavor-tab active" data-dish="chinese">Chinese</button>
    <button class="flavor-tab" data-dish="malay">Malay</button>
    <button class="flavor-tab" data-dish="indian">Indian</button>
    <div class="tab-indicator" id="tab-indicator"></div>
  </div>
  <div class="nav-right mono">SG HAWKER CO.</div>
</nav>

<div class="stage">
  <div class="eyebrow mono reveal" id="reveal-eyebrow">SINGAPORE, ONE VOID DECK AT A TIME</div>

  <div class="word-wrap reveal" id="reveal-word">
    <div class="word display active" data-dish="chinese">Chicken rice</div>
    <div class="word display" data-dish="malay">Nasi lemak</div>
    <div class="word display" data-dish="indian">Roti prata</div>

    <div class="dish-stage">
      <div class="dish active" data-dish="chinese"><div class="dish-tilt"><img src="assets/chicken-rice.png" alt="Hainanese chicken rice"></div></div>
      <div class="dish" data-dish="malay"><div class="dish-tilt"><img src="assets/nasi-lemak.png" alt="Nasi lemak"></div></div>
      <div class="dish" data-dish="indian"><div class="dish-tilt"><img src="assets/roti-prata.png" alt="Roti prata"></div></div>
    </div>
  </div>

  <div class="meta reveal" id="reveal-meta">
    <p class="stall-tag mono" id="stall-tag">STALL 04 · CHINESE</p>
    <p class="desc" id="desc">Poached chicken, silky rice, dark soy, chilli-ginger dip. The everyday classic.</p>
  </div>
</div>

<div class="foot-row reveal" id="reveal-foot">
  <div class="price mono" id="price">TODAY'S PLATE <b>$4.50</b></div>
  <button class="cta" id="cta">SEE THE STALL <span><i></i>→</span></button>
  <div class="credit">One table. A small design study of Singapore's hawker culture.</div>
</div>

<script>
/* ---------- combined tick: dish tilt + CTA magnetism ---------- */
let mx = 0, my = 0;
window.addEventListener('mousemove', (e)=>{
  mx = e.clientX - window.innerWidth/2;
  my = e.clientY - window.innerHeight/2;
});
let tiltX = 0, tiltY = 0;
const cta = document.getElementById('cta');
let ctaX = 0, ctaY = 0;
let t0 = performance.now();

function tick(now){
  const t = now - t0;

  const wobble = Math.sin(t/1600) * 2;
  const targetTiltY = (mx/window.innerWidth) * 14 + wobble;
  const targetTiltX = -(my/window.innerHeight) * 10;
  tiltX += (targetTiltX - tiltX) * 0.05;
  tiltY += (targetTiltY - tiltY) * 0.05;
  const activeTilt = document.querySelector('.dish.active .dish-tilt');
  if (activeTilt) activeTilt.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;

  if (cta){
    const rect = cta.getBoundingClientRect();
    const cxDist = (mx + window.innerWidth/2) - (rect.left + rect.width/2);
    const cyDist = (my + window.innerHeight/2) - (rect.top + rect.height/2);
    const dist = Math.hypot(cxDist, cyDist);
    const pull = dist < 90 ? 0.25 : 0;
    ctaX += (cxDist*pull - ctaX) * 0.15;
    ctaY += (cyDist*pull - ctaY) * 0.15;
    cta.style.transform = `translate(${ctaX}px, ${ctaY}px)`;
  }

  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ---------- CTA ripple on click ---------- */
cta.addEventListener('click', (e)=>{
  const rect = cta.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  cta.appendChild(ripple);
  setTimeout(()=> ripple.remove(), 650);
});

/* ---------- tab morph ---------- */
const data = {
  chinese: { color:'#E15241', word:'Chicken rice', stall:'STALL 04 · CHINESE', desc:"Poached chicken, silky rice, dark soy, chilli-ginger dip. The everyday classic.", price:'$4.50' },
  malay:   { color:'#3FA06B', word:'Nasi lemak',   stall:'STALL 11 · MALAY',   desc:'Coconut rice, crisp ikan bilis, roasted peanuts, sambal on the side.', price:'$3.80' },
  indian:  { color:'#E3A93B', word:'Roti prata',   stall:'STALL 19 · INDIAN',  desc:'Dough stretched paper-thin, torn by hand, dipped in curry gravy.', price:'$2.20' }
};
const root = document.documentElement;
const stallTag = document.getElementById('stall-tag');
const desc = document.getElementById('desc');
const priceEl = document.getElementById('price');
const wipe = document.getElementById('wipe');
const indicator = document.getElementById('tab-indicator');
const tabsWrap = document.querySelector('.flavor-tabs');

function moveIndicator(tabEl){
  const wrapRect = tabsWrap.getBoundingClientRect();
  const rect = tabEl.getBoundingClientRect();
  indicator.style.left = (rect.left - wrapRect.left) + 'px';
  indicator.style.width = rect.width + 'px';
}

function floatIn(el, delay){
  el.animate(
    [{ opacity:0, transform:'translateY(16px)' }, { opacity:1, transform:'translateY(0)' }],
    { duration:550, delay, easing:'cubic-bezier(.22,1,.36,1)', fill:'backwards' }
  );
}

function applyDishContent(key){
  const d = data[key];
  document.querySelectorAll('.flavor-tab').forEach(t=>{
    t.classList.toggle('active', t.dataset.dish===key);
    if (t.dataset.dish===key) moveIndicator(t);
  });
  document.querySelectorAll('.word').forEach(w=> w.classList.toggle('active', w.dataset.dish===key));
  document.querySelectorAll('.dish').forEach(el=> el.classList.toggle('active', el.dataset.dish===key));
  stallTag.textContent = d.stall;
  desc.textContent = d.desc;
  priceEl.innerHTML = "TODAY'S PLATE <b>" + d.price + "</b>";
  floatIn(stallTag, 0);
  floatIn(desc, 90);
  floatIn(priceEl, 160);
}

function setDish(key, originEl){
  const d = data[key];
  const rect = (originEl || document.querySelector('.flavor-tab.active')).getBoundingClientRect();
  const ox = rect.left + rect.width/2;
  const oy = rect.top + rect.height/2;
  const radius = Math.hypot(
    Math.max(ox, window.innerWidth - ox),
    Math.max(oy, window.innerHeight - oy)
  ) * 1.05;

  wipe.style.transition = 'none';
  wipe.style.background = d.color;
  wipe.style.clipPath = `circle(0px at ${ox}px ${oy}px)`;
  // eslint-disable-next-line no-unused-expressions
  wipe.offsetHeight;
  wipe.style.transition = 'clip-path .7s var(--ease)';
  requestAnimationFrame(()=>{
    wipe.style.clipPath = `circle(${radius}px at ${ox}px ${oy}px)`;
  });

  setTimeout(()=> applyDishContent(key), 280);

  setTimeout(()=>{
    root.style.setProperty('--bg', d.color);
    wipe.style.transition = 'none';
    wipe.style.clipPath = `circle(0px at ${ox}px ${oy}px)`;
  }, 720);
}

document.querySelectorAll('.flavor-tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    orderIndex = order.indexOf(tab.dataset.dish);
    setDish(tab.dataset.dish, tab);
  });
});

/* ---------- scroll-driven dish switching ---------- */
const order = ['chinese', 'malay', 'indian'];
let orderIndex = 0;
let scrollLocked = false;

window.addEventListener('wheel', (e)=>{
  e.preventDefault();
  if (scrollLocked) return;

  const goingDown = e.deltaY > 0;
  const nextIndex = orderIndex + (goingDown ? 1 : -1);
  if (nextIndex < 0 || nextIndex > order.length - 1) return;

  scrollLocked = true;
  orderIndex = nextIndex;
  const key = order[orderIndex];
  const tabEl = document.querySelector(`.flavor-tab[data-dish="${key}"]`);
  setDish(key, tabEl);

  setTimeout(()=>{ scrollLocked = false; }, 900);
}, { passive:false });

/* initial state (no wipe on load) */
root.style.setProperty('--bg', data.chinese.color);
applyDishContent('chinese');
window.addEventListener('resize', ()=> moveIndicator(document.querySelector('.flavor-tab.active')));
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(()=> moveIndicator(document.querySelector('.flavor-tab.active')));
}

/* ---------- entrance stagger ---------- */
/* script runs after DOM parse (it's at the end of body), so trigger directly
   rather than waiting on load/DOMContentLoaded, which may have already fired */
requestAnimationFrame(()=>{
  const seq = [
    ['reveal-nav', 0], ['reveal-eyebrow', 120], ['reveal-word', 220],
    ['reveal-meta', 420], ['reveal-foot', 520]
  ];
  seq.forEach(([id, delay])=>{
    const el = document.getElementById(id);
    if (!el) return;
    setTimeout(()=> el.classList.add('in'), delay);
  });
});
</script>
</body>
</html>
